name: The same scenario under READ COMMITTED does not block
category: Gap locks
tags: [gap-lock, read-committed, isolation, uuidv7, insert-intention]
description: |
  Identical to "SELECT FOR UPDATE on a missing UUIDv7 row blocks the next
  insert", with one line changed: the isolation level is READ COMMITTED.

  READ COMMITTED essentially disables gap locking. InnoDB locks index records
  it actually finds and nothing else, so a lookup that matches no row leaves no
  lock behind at all, and the concurrent insert sails through.

  Run this next to the REPEATABLE READ version and compare the Locks tab after
  step 2. There, Request A held mode X on the supremum pseudo-record. Here it
  holds nothing but the table-level IX intention lock.

  What you give up: phantom rows can appear inside a transaction, and
  statement-based replication is unsafe. What you gain is exactly the
  contention this scenario shows. It is a real trade-off, not a free fix.

mysql:
  image: mysql:8.4
  isolation: READ COMMITTED
  lock_wait_timeout: 300

schema:
  - |
    CREATE TABLE bookings (
      id      CHAR(36) NOT NULL,
      guest   VARCHAR(64) NOT NULL,
      nights  INT NOT NULL DEFAULT 1,
      PRIMARY KEY (id)
    ) ENGINE=InnoDB

seed:
  - |
    INSERT INTO bookings (id, guest, nights) VALUES
      ('01912f00-0000-7000-8000-000000000001', 'ada',     2),
      ('01912f10-0000-7000-8000-000000000002', 'grace',   3),
      ('01912f20-0000-7000-8000-000000000003', 'katherine', 1)

actors:
  - id: a
    name: Request A
    accent: blue
  - id: b
    name: Request B
    accent: amber

steps:
  - actor: a
    label: Open a transaction
    sql: BEGIN
    expect: ok

  - actor: a
    label: Look up a booking that does not exist
    sql: SELECT * FROM bookings WHERE id = '01912f90-0000-7000-8000-0000000000aa' FOR UPDATE
    note: >-
      Zero rows, and this time zero row locks. Check the Locks tab: only the
      table-level IX intention lock remains.
    expect: ok

  - actor: b
    label: Open a transaction
    sql: BEGIN
    expect: ok

  - actor: b
    label: Insert a brand new booking
    sql: >-
      INSERT INTO bookings (id, guest, nights)
      VALUES ('01912f95-0000-7000-8000-0000000000bb', 'marie', 4)
    note: Completes immediately. There is no gap lock to conflict with.
    expect: ok

  - actor: a
    label: Commit
    sql: COMMIT
    expect: ok

  - actor: b
    label: Commit
    sql: COMMIT
    expect: ok
