name: SELECT FOR UPDATE on a missing UUIDv7 row blocks the next insert
category: Gap locks
tags: [gap-lock, uuidv7, select-for-update, insert-intention, supremum]
docs:
  - title: InnoDB Locking — gap locks
    url: https://dev.mysql.com/doc/refman/8.4/en/innodb-locking.html#innodb-gap-locks
    note: The manual's definition of gap and next-key locks.
  - title: InnoDB Locking — insert intention locks
    url: https://dev.mysql.com/doc/refman/8.4/en/innodb-locking.html#innodb-insert-intention-locks
    note: Why an insert waits on a gap lock it does not overlap.

description: |
  The one that bites in production.

  A request does SELECT ... FOR UPDATE on a primary key that does not exist —
  a "does this booking already exist?" check, or a lookup by an id that was
  never inserted. The query returns zero rows, so it feels harmless.

  It is not. In REPEATABLE READ, when a unique-index lookup finds no row,
  InnoDB still has to stop anyone else from creating that row before the
  transaction ends. It cannot lock a record that is not there, so it locks the
  GAP where the record would go.

  UUIDv7 is what turns this from a curiosity into an outage. UUIDv7 is
  time-ordered: the first 48 bits are a millisecond timestamp, so every id
  generated from now on sorts ABOVE every id already in the table. They all
  land in the same gap — the one between the highest existing key and the end
  of the index, which InnoDB calls the supremum pseudo-record.

  So one transaction locking the gap for a single missing id ends up blocking
  every concurrent insert of a fresh UUIDv7, whether or not those rows have
  anything to do with each other.

  Watch the Locks tab after step 2: Request A holds mode X on the PRIMARY
  index at the supremum pseudo-record. Supremum is not a real row, so an X
  next-key lock on it locks only the gap above the highest key — a gap lock in
  everything but the label. After step 4, Request B is sitting there WAITING
  with X,INSERT_INTENTION on that same gap.

  The column type is not the point. CHAR(36) is used here only so the key
  values are readable in LOCK_DATA; BINARY(16) behaves identically.

mysql:
  image: mysql:8.4
  isolation: REPEATABLE READ
  lock_wait_timeout: 300

schema:
  - |
    CREATE TABLE bookings (
      id      CHAR(36) NOT NULL,
      guest   VARCHAR(64) NOT NULL,
      nights  INT NOT NULL DEFAULT 1,
      PRIMARY KEY (id)
    ) ENGINE=InnoDB

seed:
  - |
    INSERT INTO bookings (id, guest, nights) VALUES
      ('01912f00-0000-7000-8000-000000000001', 'ada',     2),
      ('01912f10-0000-7000-8000-000000000002', 'grace',   3),
      ('01912f20-0000-7000-8000-000000000003', 'katherine', 1)

actors:
  - id: a
    name: Request A
    accent: blue
  - id: b
    name: Request B
    accent: amber

steps:
  - actor: a
    label: Open a transaction
    sql: BEGIN
    expect: ok

  - actor: a
    label: Look up a booking that does not exist
    sql: SELECT * FROM bookings WHERE id = '01912f90-0000-7000-8000-0000000000aa' FOR UPDATE
    note: >-
      Zero rows returned, and it still took a lock. Open the Locks tab: mode X
      on the PRIMARY index at the supremum pseudo-record. That gap covers every
      key greater than the highest existing booking id.
    expect: ok

  - actor: b
    label: Open a transaction
    sql: BEGIN
    expect: ok

  - actor: b
    label: Insert a brand new booking
    sql: >-
      INSERT INTO bookings (id, guest, nights)
      VALUES ('01912f95-0000-7000-8000-0000000000bb', 'marie', 4)
    note: >-
      A completely unrelated booking, with a different id, inserted by a
      different request. It blocks. The new UUIDv7 sorts above every existing
      key, so it needs the same gap Request A locked. An insert must first take
      an insert intention lock on the gap, and insert intention conflicts with
      a gap lock held by someone else.
    expect: blocks

  - actor: a
    label: Commit
    sql: COMMIT
    note: >-
      Request A's gap lock is released and Request B's insert completes
      immediately. Nothing about Request A ever touched Request B's row.
    expect: ok

  - actor: b
    label: Commit
    sql: COMMIT
    expect: ok
